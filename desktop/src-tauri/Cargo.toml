[package]
name = "studyrag-desktop"
version = "0.1.0"
edition = "2021"
description = "StudyRAG desktop (Windows + macOS)"
authors = ["StudyRAG"]
license = "Proprietary"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-window-state = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
